# TODO(student) Exercise 5: write the model path. tests/test_workflows.py checks it.
# - Triggers: workflow_dispatch with a required `reason` input, and a schedule with a
#   cron. Not push.
# - defaults.run.working-directory: this lab's folder, as in ci.yml.
# - Call make targets only, never src/main.py. Stop at the gate: no register, promote or
#   deploy.
# - One job and its steps:
#
#   retrain
#     check out the code, set up uv, install all groups, then these named steps:
#     - "Why this run happened": prints the trigger and the reason
#     - "Rebuild the dataset"
#     - "retrain and gate": through the Makefile
#     - "Publish the gate verdict to the job summary": writes `make gate-summary` to
#       $GITHUB_STEP_SUMMARY, also when an earlier step failed
#     - "Annotate a NO-GO": an ::error:: line, only when an earlier step failed
#     - "Upload the evidence": metrics/, reports/ and models/model.pkl, also when an
#       earlier step failed
#
# Reference: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
name: Week 7 CT

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you retraining? (recorded in the run)"
        required: true
        default: "manual check"
        type: string

 # A clock: 03:00 UTC every Monday. GitHub may run it late, or skip it under load.
  schedule:
    - cron: "0 3 * * 1"

defaults:
  run:
    working-directory: labs/week-07-ci-workflow/starter

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups

      - name: Why this run happened
        env:
          REASON: ${{ inputs.reason || 'scheduled' }}
        run: |
          echo "trigger: ${{ github.event_name }}"
          echo "reason : $REASON"

      - name: Rebuild the dataset
        run: make data-v2

      - name: retrain and gate
        run: make ct-local

      - name: Publish the gate verdict to the job summary
        if: always()
        run: make gate-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate a NO-GO
        if: failure()
        run: echo "::error title=Retrain refused::The new model did not pass the gate. Nothing was released."

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: week07-ct-evidence
          if-no-files-found: warn
          path: |
            labs/week-07-ci-workflow/starter/metrics/
            labs/week-07-ci-workflow/starter/reports/
            labs/week-07-ci-workflow/starter/models/model.pkl
